apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ai-learning-assistant.fullname" . }}
  labels:
    {{- include "ai-learning-assistant.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  tls:
    - hosts:
        - {{ .Values.domainName }}
      secretName: {{ include "ai-learning-assistant.fullname" . }}-tls
  rules:
    - host: {{ .Values.domainName }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "ai-learning-assistant.fullname" . }}-backend
                port:
                  number: 8000
          - path: /health
            pathType: Exact
            backend:
              service:
                name: {{ include "ai-learning-assistant.fullname" . }}-backend
                port:
                  number: 8000
          - path: /metrics
            pathType: Exact
            backend:
              service:
                name: {{ include "ai-learning-assistant.fullname" . }}-backend
                port:
                  number: 8000
          - path: /uploads
            pathType: Prefix
            backend:
              service:
                name: {{ include "ai-learning-assistant.fullname" . }}-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "ai-learning-assistant.fullname" . }}-frontend
                port:
                  number: 80
